  <script>
    const destination=new URL('https://jovey-mission-control.aznr5.chatgpt.site/');

    destination.hash=/^#(?:bots|calendar|roadmap-[a-z0-9-]+)$/.test(view)?view:'#roadmap-all';
    // Only a view fragment is carried across. Never copy query parameters or credentials.
    window.location.replace(destination.toString());
