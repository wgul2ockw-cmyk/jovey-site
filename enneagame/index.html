<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=https://enneagame.app/">
  <link rel="canonical" href="https://enneagame.app/">
  <title>Opening ENNEAGAME</title>
  <script>
    const destination = new URL('https://enneagame.app/');
    destination.search = window.location.search;
    destination.hash = window.location.hash;
    window.location.replace(destination.toString());
  </script>
</head>
<body>
  <p>
    Opening ENNEAGAME. If you are not redirected,
    <a href="https://enneagame.app/">continue to the website</a>.
  </p>
</body>
</html>
