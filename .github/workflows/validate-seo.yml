name: Validate Jovey SEO
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_seo.py
      - run: python3 scripts/check_mindspend.py
      - run: python3 scripts/export_pulse_lab.py && git diff --exit-code -- pulse-lab/Pulse_Lab_S15_Jovey.html pulse-lab/export-manifest.json
      - run: node scripts/check_pulse_lab.mjs --standalone && node scripts/check_pulse_lab.mjs
      - run: node --check attention/app.js && node --check attention/sw.js
