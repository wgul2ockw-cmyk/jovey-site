name: Validate Jovey SEO
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_seo.py
      - run: python3 scripts/check_mindspend.py
      - run: node --check attention/app.js && node --check attention/sw.js
